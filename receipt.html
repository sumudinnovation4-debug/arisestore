<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Receipt | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=3">
<style>
body{padding-bottom:30px}
.bar{background:var(--header);color:#fff}
.bar .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.bar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:7px 13px;font-size:14px}
.bar .btn.primary{background:var(--sun);border-color:var(--sun);color:#2b1700}
.sheet{max-width:780px;margin:16px auto;background:#fff;color:#111827;border:1px solid #d9dee7;border-radius:12px;padding:28px;position:relative;font-size:14px;line-height:1.5}
.rh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid #12284a;padding-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:48px;height:48px;flex:none}
.brand h1{font:800 21px var(--font-display);color:#12284a}
.brand p{margin:2px 0 0;color:#5b6678;font-size:12px}
.meta{text-align:right}
.meta .kind{font:800 24px var(--font-display);letter-spacing:.12em;color:#12284a;display:block}
.meta div{color:#374151;font-size:13px}
.stamp{display:inline-block;border:3px solid #1b7f4b;color:#1b7f4b;font-weight:800;letter-spacing:.16em;padding:2px 14px;border-radius:8px;transform:rotate(-6deg);font-size:20px;margin-top:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.sheet h3{font:700 11px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#5b6678;margin:0 0 4px}
.sheet p{margin:0}
.tw{overflow-x:auto}
.sheet table{min-width:480px;width:100%;border-collapse:collapse}
.sheet th{background:#f1f4f9;color:#374151;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid #d9dee7}
.sheet td{padding:10px;border-bottom:1px solid #e5e9f0;color:#111827;vertical-align:top}
.sheet .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.totals{margin:14px 0 0 auto;max-width:300px;display:grid;gap:6px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{border-top:2px solid #12284a;padding-top:8px;font:800 19px var(--font-display);color:#12284a}
.foot{margin-top:26px;border-top:1px solid #e5e9f0;padding-top:14px;color:#374151;font-size:13px;display:grid;gap:6px}
.foot .thanks{font:700 16px var(--font-display);color:#12284a}
.state{max-width:560px;margin:30px auto}
#cap{position:fixed;left:-10000px;top:0;width:780px}
#actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.sheet:not(.cap) table{min-width:0}.sheet:not(.cap) th,.sheet:not(.cap) td{padding:8px 5px}.sheet:not(.cap) .r{white-space:normal}.sheet:not(.cap){padding:16px;margin:10px}.sheet:not(.cap) .cols{grid-template-columns:1fr}.sheet:not(.cap) .meta{text-align:left}.bar .btn{flex:1;text-align:center}.bar .sp{display:none}#actions{display:flex;gap:8px;flex:1 1 100%;flex-wrap:wrap}#actions .btn{flex:1 1 40%}}
@media print{
  @page{size:A4;margin:14mm}
  html,body{background:#fff!important;padding:0!important}
  .bar,.noprint{display:none!important}
  .sheet{border:0;border-radius:0;margin:0;max-width:none;padding:0}
  .tw{overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head>
<body>
<div class="bar noprint"><div class="wrap">
  <a class="btn" href="javascript:history.back()">‹ Back</a>
  <span class="sp"></span>
  <span id="actions"></span>
</div></div>
<div id="cap" aria-hidden="true"></div>
<main id="main"><div class="state"><div class="empty">Loading receipt…</div></div></main>

<script src="config.js"></script><script src="assets/catalog.js?v=3"></script><script src="assets/app.js?v=3"></script>
<script>
var $ = A.$, qs = new URLSearchParams(location.search);
var ref = qs.get("ref") || "", phone = qs.get("phone") || "", autoPrint = qs.get("print") === "1";
var main = document.getElementById("main");

function fmt(d) { return new Date(d).toLocaleString("en-NG", { dateStyle: "long", timeStyle: "short" }); }
function state(html) { main.innerHTML = '<div class="state">' + html + "</div>"; }
function logo() {
  return '<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#12284a"/><path d="M6 27h28" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/><path d="M11 27a9 9 0 0 1 18 0" fill="#ffb347"/><path d="M20 8v4M9 13l3 3M31 13l-3 3" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round"/></svg>';
}

function loadJs(src) {
  return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = function () { no(new Error("Could not load " + src)); }; document.head.appendChild(s); });
}
function libs(kind) {
  var p = window.html2canvas ? Promise.resolve() : loadJs("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if (kind === "pdf" && !(window.jspdf)) p = p.then(function () { return loadJs("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"); });
  return p;
}
function download(blob, name) {
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function save(kind, btn) {
  var label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
  var name = (document.title.split(" | ")[0] || "Receipt").replace(/\s+/g, "-");
  var cap = document.getElementById("cap"), copy = document.getElementById("sheet").cloneNode(true);
  copy.removeAttribute("id"); copy.className = "sheet cap"; copy.style.margin = "0"; copy.style.border = "0"; copy.style.borderRadius = "0";
  cap.innerHTML = ""; cap.appendChild(copy);
  libs(kind).then(function () { return html2canvas(copy, { scale: 2, backgroundColor: "#ffffff", useCORS: true }); }).then(function (cv) {
    if (kind === "png") return new Promise(function (ok) { cv.toBlob(function (b) { download(b, name + ".png"); ok(); }, "image/png"); });
    var J = window.jspdf.jsPDF, pdf = new J({ unit: "pt", format: "a4" }), W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight(), m = 28;
    var w = W - m * 2, h = cv.height * w / cv.width, img = cv.toDataURL("image/jpeg", 0.95);
    if (h <= H - m * 2) pdf.addImage(img, "JPEG", m, m, w, h);
    else { var y = 0; while (y < h) { if (y) pdf.addPage(); pdf.addImage(img, "JPEG", m, m - y, w, h); y += H - m * 2; } }
    download(pdf.output("blob"), name + ".pdf");
  }).catch(function () { A.toast("Could not create the file. Check your connection, or use Print."); })
    .then(function () { cap.innerHTML = ""; btn.disabled = false; btn.textContent = label; });
}

function show(o, settings, isOwner) {
  var C = A.C, note = settings && settings.receipt_note;
  document.title = "Receipt " + A.receiptNo(o) + " | " + C.name;
  var contact = [];
  if (C.address) contact.push(A.esc(C.address));
  if (C.phone) contact.push("Phone: " + A.esc(C.phone));
  if (C.whatsapp) contact.push("WhatsApp: " + A.esc(C.whatsapp));
  if (C.email) contact.push(A.esc(C.email));
  var addr = o.delivery_method === "pickup" ? "Store pickup" : A.esc([o.address, o.city, o.state].filter(Boolean).join(", "));
  var fee = Number(o.delivery_fee) || 0;
  main.innerHTML = '<article class="sheet" id="sheet">' +
    '<div class="rh"><div class="brand">' + logo() + "<div><h1>" + A.esc(C.name) + "</h1><p>" + (contact.length ? contact.join(" · ") : "Computers, printers and accessories") + "</p></div></div>" +
    '<div class="meta"><span class="kind">RECEIPT</span><div>No. <b>' + A.esc(A.receiptNo(o)) + "</b></div><div>Order " + A.esc(o.ref) + "</div><div>" + fmt(A.paidAt(o)) + '</div><span class="stamp">PAID</span></div></div>' +
    '<div class="cols"><div><h3>Billed to</h3><p><b>' + A.esc(o.customer_name) + "</b></p>" + (o.phone ? "<p>" + A.esc(o.phone) + "</p>" : "") + (o.email ? "<p>" + A.esc(o.email) + "</p>" : "") + "</div>" +
    "<div><h3>" + (o.delivery_method === "pickup" ? "Collection" : "Delivered to") + "</h3><p>" + addr + "</p><h3 style=\"margin-top:10px\">Payment method</h3><p>" + A.esc(A.payLabel(o.payment_method)) + "</p></div></div>" +
    '<div class="tw"><table><thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>' +
    (o.items || []).map(function (i) { return "<tr><td>" + A.esc(i.name) + '</td><td class="r">' + i.qty + '</td><td class="r">' + A.money(i.price) + '</td><td class="r">' + A.money(i.price * i.qty) + "</td></tr>"; }).join("") +
    '</tbody></table></div>' +
    '<div class="totals"><div><span>Subtotal</span><span>' + A.money(o.subtotal) + "</span></div><div><span>Delivery</span><span>" + (o.delivery_method === "pickup" ? "Pickup" : fee ? A.money(fee) : "Free") + '</span></div><div class="grand"><span>Total paid</span><span>' + A.money(o.total) + "</span></div></div>" +
    '<div class="foot"><div class="thanks">Thank you for shopping with us.</div>' + (note ? "<div>" + A.esc(note).replace(/\n/g, "<br>") + "</div>" : "") +
    "<div>Keep this receipt as proof of purchase. Questions about this order? Quote order number " + A.esc(o.ref) + ".</div></div></article>";

  var wa = isOwner && o.phone ? '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + String(o.phone).replace(/\D/g, "").replace(/^0/, "234") + "?text=" +
    encodeURIComponent("Hello " + o.customer_name + ", your payment of " + A.money(o.total) + " for order " + o.ref + " is confirmed. Thank you! Your receipt: " + A.receiptUrl(o)) + '">Send on WhatsApp</a> ' : "";
  $("#actions").innerHTML = wa + '<button class="btn primary" id="pdf">Download PDF</button><button class="btn" id="img">Save as image</button><button class="btn" id="print">Print</button>';
  $("#print").onclick = function () { window.print(); };
  $("#pdf").onclick = function () { save("pdf", this); };
  $("#img").onclick = function () { save("png", this); };
  if (autoPrint) setTimeout(function () { save("pdf", $("#pdf")); }, 400);
}

if (!A.getOrder) { state('<div class="msg bad">The site files are out of date. Upload the new assets/app.js, then refresh.</div>'); } else Promise.all([A.getOrder(ref, phone), A.getSettings(), A.auth.isAdmin()]).then(function (r) {
  var o = r[0];
  if (!o) {
    state('<div class="msg bad">We could not find that receipt.</div><p class="note">Open it from <a href="track.html">Track order</a> with your order number and phone number, or sign in as the store owner.</p>');
    return;
  }
  if (o.payment_status !== "paid") {
    state('<div class="msg warn"><b>Receipt not ready yet</b><br>Order ' + A.esc(o.ref) + ' has not been marked as paid. The receipt appears here as soon as payment is confirmed.</div><p><a class="btn" href="track.html?ref=' + encodeURIComponent(o.ref) + (phone ? "&phone=" + encodeURIComponent(phone) : "") + '">Back to order</a></p>');
    return;
  }
  show(o, r[1], r[2]);
}).catch(function (e) { state('<div class="msg bad">Could not load the receipt. ' + A.esc(e.message) + "</div>"); });
</script>
</body></html>
