<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your order | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css"></head>
<body>
<div id="site-header"></div>
<main class="wrap block" style="max-width:820px">
  <h1 style="font-size:32px;margin-bottom:6px">Track your order</h1>
  <p class="note" style="margin-bottom:16px">Enter the order number from your confirmation and the phone number you ordered with.</p>
  <form id="f" class="panel" style="margin-bottom:18px">
    <div class="two">
      <div class="field"><label for="ref">Order number</label><input id="ref" placeholder="ASDW-1A2B3C" autocapitalize="characters" required></div>
      <div class="field"><label for="phone">Phone number</label><input id="phone" inputmode="tel" required></div>
    </div>
    <button class="btn primary">Track order</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="assets/catalog.js"></script><script src="assets/app.js"></script>
<script>
A.layout("profile");
var $ = A.$, qs = new URLSearchParams(location.search), current = null;
$("#ref").value = qs.get("ref") || ""; $("#phone").value = qs.get("phone") || "";

function fmt(d) { return new Date(d).toLocaleString("en-NG", { dateStyle: "medium", timeStyle: "short" }); }
function render(o, notice) {
  current = o;
  if (notice && notice.cls === "ok" && o.payment_status !== "paid") notice = { cls: "warn", text: "We have not yet confirmed your payment. This page updates once it is confirmed." };
  var steps = ["placed", "confirmed", "processing", o.delivery_method === "pickup" ? "ready_for_pickup" : "out_for_delivery", "delivered"];
  var idx = steps.indexOf(o.status), html = "";
  if (notice) html += '<div class="msg ' + notice.cls + '">' + notice.text + "</div>";
  var paidTag = o.payment_status === "paid" ? '<span class="tag ok">Paid</span>' : o.payment_status === "failed" ? '<span class="tag bad">Payment failed</span>' : '<span class="tag warn">Payment pending</span>';
  html += '<div class="panel" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><h2 style="margin:0">Order ' + A.esc(o.ref) + "</h2>" + paidTag + "</div>" +
    '<p class="note">Placed ' + fmt(o.created_at) + "</p>";
  if (o.status === "cancelled") html += '<div class="msg bad">This order was cancelled.</div>';
  else html += '<div class="steps">' + steps.map(function (s, i) { return '<div class="' + (i <= idx ? "done" : "") + '">' + A.STATUS[s] + "</div>"; }).join("") + "</div>";
  if (o.payment_status !== "paid" && o.status !== "cancelled") {
    if (o.payment_method === "paystack" && A.canPayOnline()) html += '<p><button class="btn primary" id="payNow">Pay ' + A.money(o.total) + " now</button></p>";
    var b = A.C.bank || {};
    if (o.payment_method === "transfer" && b.accountNumber) html += '<div class="msg"><b>Pay by bank transfer</b><br>Bank: ' + A.esc(b.bank) + "<br>Account name: " + A.esc(b.accountName) + "<br>Account number: " + A.esc(b.accountNumber) +
      "<br>Amount: " + A.money(o.total) + "<br>Use <b>" + A.esc(o.ref) + "</b> as the narration. We confirm your payment and update this page.</div>";
  }
  html += "</div>";
  html += '<div class="panel" style="margin-bottom:16px"><h2>Items</h2><div class="sum">' + (o.items || []).map(function (i) {
    return "<div><span>" + i.qty + " × " + A.esc(i.name) + "</span><span>" + A.money(i.price * i.qty) + "</span></div>";
  }).join("") + "<div><span>Delivery</span><span>" + (Number(o.delivery_fee) ? A.money(o.delivery_fee) : "Free") + '</span></div><div class="tot"><span>Total</span><span>' + A.money(o.total) + "</span></div></div>" +
    '<p class="note" style="margin-top:10px">' + (o.delivery_method === "pickup" ? "Pickup from the store." : "Delivery to " + A.esc([o.address, o.city, o.state].filter(Boolean).join(", "))) + "</p></div>";
  html += '<div class="panel"><h2>Updates</h2><ul class="timeline">' + (o.events || []).slice().reverse().map(function (e) {
    return "<li><b>" + A.esc(A.STATUS[e.status] || e.status) + "</b><br>" + (e.note ? A.esc(e.note) + "<br>" : "") + "<small>" + fmt(e.created_at) + "</small></li>";
  }).join("") + "</ul></div>";
  $("#out").innerHTML = html;
  var pn = document.getElementById("payNow");
  if (pn) pn.onclick = function () {
    pn.disabled = true;
    A.payOnline({ ref: o.ref, email: o.email, total: o.total,
      onDone: function () { A.verifyPayment(o.ref).then(function () { lookup({ cls: "ok", text: "Payment received. Thank you." }); }); },
      onClose: function () { pn.disabled = false; } }).catch(function (e) { pn.disabled = false; A.toast(e.message); });
  };
}
function lookup(notice) {
  var ref = $("#ref").value.trim(), phone = $("#phone").value.trim();
  if (!ref || !phone) return;
  $("#out").innerHTML = '<div class="empty">Looking up your order…</div>';
  A.trackOrder(ref, phone).then(function (o) {
    if (!o) { $("#out").innerHTML = '<div class="msg bad">We could not find an order with that number and phone. Check both and try again.</div>'; return; }
    render(o, notice);
  }).catch(function (e) { $("#out").innerHTML = '<div class="msg bad">' + A.esc(e.message) + "</div>"; });
}
$("#f").addEventListener("submit", function (e) { e.preventDefault(); lookup(); });
if (qs.get("ref") && qs.get("phone")) {
  lookup(qs.get("paid") ? { cls: "ok", text: "Payment received. Thank you! Keep your order number to track this order." }
    : qs.get("new") ? { cls: "warn", text: "Your order is placed. Save your order number: you need it with your phone number to track the order." } : null);
}
</script>
</body></html>
