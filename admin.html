<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Store admin | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=3">
<style>
body{padding-bottom:40px}
.ah{background:var(--header);color:#fff;position:sticky;top:0;z-index:30}
.ah .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.ah b{font-family:var(--font-display);font-size:17px}
.ah small{opacity:.7;display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.ah .sp{flex:1}
.ah .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:6px 12px;font-size:13px}
.tabs2{background:var(--surface);border-bottom:1px solid var(--line)}
.tabs2 .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs2 button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs2 button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs2 .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:0 6px;margin-left:5px}
main.wrap{padding-block:16px}
h2.t{font-size:20px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:block;width:100%}
.tile b{font-size:24px;font-family:var(--font-display);display:block;line-height:1.1;overflow-wrap:anywhere}
.tile span{color:var(--muted);font-size:13px}
.tile.alert{border-color:var(--warn)}
.tile.alert b{color:var(--warn)}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.two-col{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}
.bars i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;display:block}
.barlab{display:flex;gap:5px;font-size:10px;color:var(--muted);margin-top:4px}
.barlab span{flex:1;text-align:center;overflow:hidden}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tb input,.tb select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0}
.tb input[type=search]{flex:1 1 180px}
.tb .sp{flex:1}
.pth{width:44px;height:44px;flex:none}
.pth .media{aspect-ratio:1;border-radius:6px}
td .num{width:104px}
.prod{display:flex;gap:10px;align-items:center;min-width:0}
.prod b{font-weight:600;display:block;overflow-wrap:anywhere}
.prod small{color:var(--muted)}
.bulk{position:sticky;bottom:10px;background:var(--header);color:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;z-index:20}
.bulk input{width:100px;border-radius:8px;border:0;padding:7px 8px}
.bulk .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:6px 11px;font-size:13px}
.scrim2{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:51;overflow:auto;padding:16px;border-left:1px solid var(--line)}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.drawer .dh h2{font-size:19px}
.x{border:0;background:var(--bg);border-radius:8px;padding:6px 11px;font-size:18px;line-height:1}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox .pv{width:96px;height:96px;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;display:grid;place-items:center}
.imgbox .pv img{width:100%;height:100%;object-fit:contain}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
textarea.csv{width:100%;min-height:150px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.ok{color:var(--ok);font-weight:700}.err{color:var(--bad);font-weight:700}
.arow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1.3fr) 90px auto;gap:8px;margin-bottom:8px}
.sfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.sf input{width:96px}
@media (max-width:600px){.arow{grid-template-columns:1fr 1fr}.arow [data-a="area"]{grid-column:1/-1}.sfgrid{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="gate" class="wrap" style="padding-block:24px"></div>

<div id="app" hidden>
  <header class="ah"><div class="wrap">
    <div><b>Store admin</b><small>Arise and Shine Digital World</small></div>
    <span class="sp"></span>
    <a class="btn" href="index.html" target="_blank" rel="noopener">View store</a>
    <button class="btn" id="out">Sign out</button>
  </div></header>
  <nav class="tabs2" aria-label="Admin sections"><div class="wrap" id="tabs"></div></nav>
  <main class="wrap" id="view"></main>
</div>
<div id="drawerRoot"></div>

<script src="config.js"></script><script src="assets/catalog.js?v=3"></script><script src="assets/app.js?v=3"></script>
<script>
var $ = A.$;
var ORDERS = [], PRODUCTS = [], SETTINGS = {}, view = "overview";
var oF = "", oQ = "", pQ = "", pCat = "", pF = "", pLimit = 60, SEL = {};
var STATUSES = Object.keys(A.STATUS);
var OPEN = ["placed", "confirmed", "processing", "out_for_delivery", "ready_for_pickup"];
var TABS = [["overview", "Overview"], ["orders", "Orders"], ["products", "Products"], ["import", "Add many at once"], ["settings", "Settings"]];

function fmt(d) { return new Date(d).toLocaleString("en-NG", { dateStyle: "medium", timeStyle: "short" }); }
function catName(slug) { return (A.cat(slug) || {}).name || slug; }
function waLink(phone, text) {
  var d = String(phone).replace(/\D/g, ""); if (d.charAt(0) === "0") d = "234" + d.slice(1);
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(text);
}
function fail(e) {
  if (/jwt|token|expired|permission|401|403|row-level/i.test(e.message)) { A.toast("Your session ended or you do not have access. Sign in again."); }
  else A.toast(e.message);
}

/* ---------- access gate ---------- */
function gate() {
  $("#app").hidden = true; $("#gate").hidden = false;
  if (!A.LIVE) { $("#gate").innerHTML = '<div class="msg warn">The admin dashboard needs Supabase. Add your Supabase URL and anon key in config.js (see README.md), then reload.</div>'; return; }
  if (!A.auth.user()) {
    $("#gate").innerHTML = '<div class="panel" style="max-width:380px;margin:40px auto"><h2>Owner access</h2><p class="note" style="margin-bottom:12px">Sign in with the store owner account to manage orders and products.</p><a class="btn primary" href="profile.html?next=admin.html">Sign in</a></div>';
    return;
  }
  $("#gate").innerHTML = '<div class="empty">Checking access…</div>';
  A.auth.isAdmin().then(function (ok) {
    if (ok) start();
    else $("#gate").innerHTML = '<div class="panel" style="max-width:420px;margin:40px auto"><div class="msg bad">This page is only for the store owner.</div><a class="btn" href="profile.html">Back to my account</a></div>';
  });
}
function start() {
  $("#gate").hidden = true; $("#app").hidden = false;
  var h = location.hash.replace("#", ""); if (TABS.some(function (t) { return t[0] === h; })) view = h;
  A.getSettings().then(function (s) { SETTINGS = s || {}; }).catch(function () {});
  load();
}
function load(quiet) {
  if (!quiet) $("#view").innerHTML = '<div class="empty">Loading…</div>';
  return Promise.all([A.admin.orders(), A.admin.products()]).then(function (r) {
    ORDERS = r[0] || []; PRODUCTS = r[1] || [];
    return A.getSettings().then(function (s) { A.syncCats(PRODUCTS, s); }).then(function () { render(); });
  }).catch(function (e) { $("#view").innerHTML = '<div class="msg bad">Could not load data. ' + A.esc(e.message) + "</div>"; fail(e); });
}
function go(v) { view = v; SEL = {}; location.hash = v; render(); window.scrollTo(0, 0); }
function tabsHtml() {
  var open = ORDERS.filter(function (o) { return OPEN.indexOf(o.status) > -1; }).length;
  $("#tabs").innerHTML = TABS.map(function (t) {
    return '<button data-tab="' + t[0] + '" aria-current="' + (t[0] === view) + '">' + t[1] + (t[0] === "orders" && open ? '<span class="n">' + open + "</span>" : "") + "</button>";
  }).join("");
}
function render() {
  tabsHtml();
  ({ overview: overview, orders: orders, products: products, import: importView, settings: settings })[view]();
}

/* ---------- overview ---------- */
function overview() {
  var live = ORDERS.filter(function (o) { return o.status !== "cancelled"; });
  var paid = live.filter(function (o) { return o.payment_status === "paid"; });
  var sum = function (l) { return l.reduce(function (n, o) { return n + Number(o.total); }, 0); };
  var d30 = Date.now() - 30 * 864e5;
  var open = ORDERS.filter(function (o) { return OPEN.indexOf(o.status) > -1; });
  var unpaid = live.filter(function (o) { return o.payment_status !== "paid"; });
  var noPrice = PRODUCTS.filter(function (p) { return p.price == null; });
  var low = PRODUCTS.filter(function (p) { return p.stock != null && p.stock <= 3; });
  var hidden = PRODUCTS.filter(function (p) { return !p.active; });
  var days = [], i;
  for (i = 13; i >= 0; i--) { var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ d: d, v: 0 }); }
  paid.forEach(function (o) { var t = new Date(o.created_at); t.setHours(0, 0, 0, 0); days.forEach(function (x) { if (x.d.getTime() === t.getTime()) x.v += Number(o.total); }); });
  var max = Math.max.apply(null, days.map(function (x) { return x.v; })) || 1;
  $("#view").innerHTML =
    '<div class="tiles">' +
    '<button class="tile' + (open.length ? " alert" : "") + '" data-jump="orders:open"><b>' + open.length + "</b><span>Orders to fulfil</span></button>" +
    '<button class="tile' + (unpaid.length ? " alert" : "") + '" data-jump="orders:unpaid"><b>' + unpaid.length + "</b><span>Waiting for payment</span></button>" +
    '<div class="tile"><b>' + A.money(sum(paid.filter(function (o) { return new Date(o.created_at) > d30; }))) + "</b><span>Paid, last 30 days</span></div>" +
    '<div class="tile"><b>' + A.money(sum(paid)) + "</b><span>Paid, all time</span></div></div>" +
    '<div class="tiles">' +
    '<button class="tile" data-jump="products:"><b>' + PRODUCTS.length + "</b><span>Products listed" + (hidden.length ? " (" + hidden.length + " hidden)" : "") + "</span></button>" +
    '<button class="tile' + (noPrice.length ? " alert" : "") + '" data-jump="products:noprice"><b>' + noPrice.length + "</b><span>Products without a price</span></button>" +
    '<button class="tile' + (low.length ? " alert" : "") + '" data-jump="products:low"><b>' + low.length + "</b><span>Low or out of stock</span></button></div>" +
    '<div class="two-col"><div class="panel"><h2>Paid sales, last 14 days</h2><div class="bars">' +
    days.map(function (x) { return '<i style="height:' + Math.max(2, Math.round(x.v / max * 100)) + '%" title="' + x.d.toLocaleDateString("en-NG", { day: "numeric", month: "short" }) + ": " + A.money(x.v) + '"></i>'; }).join("") +
    '</div><div class="barlab">' + days.map(function (x, k) { return "<span>" + (k % 2 === 0 ? x.d.getDate() : "") + "</span>"; }).join("") + "</div></div>" +
    '<div class="panel"><h2>Latest orders</h2>' + (ORDERS.length ? '<div class="tablewrap" style="border:0"><table style="min-width:0"><tbody>' + ORDERS.slice(0, 7).map(function (o) {
      return '<tr class="click" data-order="' + A.esc(o.id) + '"><td><b>' + A.esc(o.ref) + "</b><br><small class=\"note\">" + A.esc(o.customer_name) + "</small></td><td>" + A.money(o.total) + '</td><td><span class="tag ' + (o.payment_status === "paid" ? "ok" : "warn") + '">' + (o.payment_status === "paid" ? "Paid" : "Unpaid") + "</span></td></tr>";
    }).join("") + "</tbody></table></div>" : '<p class="note">No orders yet. They appear here when customers check out.</p>') + "</div></div>" +
    (noPrice.length ? '<div class="msg warn" style="margin-top:14px">' + noPrice.length + ' products have no price, so customers can only ask for a quote on them. <a href="#products" data-jump="products:noprice">Set prices</a> or <a href="#import" data-jump="import:">add many at once</a>.</div>' : "");
}

/* ---------- orders ---------- */
function orderRows() {
  var q = oQ.trim().toLowerCase();
  return ORDERS.filter(function (o) {
    if (oF === "open" && OPEN.indexOf(o.status) < 0) return false;
    if (oF === "unpaid" && !(o.payment_status !== "paid" && o.status !== "cancelled")) return false;
    if (oF && oF !== "open" && oF !== "unpaid" && o.status !== oF) return false;
    return !q || (o.ref + " " + o.customer_name + " " + o.phone + " " + o.email).toLowerCase().indexOf(q) > -1;
  });
}
function orders() {
  var chips = [["", "All"], ["open", "To fulfil"], ["unpaid", "Unpaid"]].concat(STATUSES.map(function (s) { return [s, A.STATUS[s]]; }));
  $("#view").innerHTML = '<h2 class="t">Orders</h2><div class="tb"><input id="oq" type="search" placeholder="Search order number, name or phone" value="' + A.esc(oQ) + '"><button class="btn small" id="refresh">Refresh</button></div>' +
    '<div class="chips scroll" style="margin-bottom:12px">' + chips.map(function (c) { return '<button class="chip" data-of="' + c[0] + '" aria-pressed="' + (oF === c[0]) + '">' + c[1] + "</button>"; }).join("") + '</div><div id="olist"></div>';
  ordersList();
}
function ordersList() {
  var list = orderRows();
  $("#olist").innerHTML = '<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Placed</th></tr></thead><tbody>' +
    (list.length ? list.map(function (o) {
      return '<tr class="click" data-order="' + A.esc(o.id) + '"><td><b>' + A.esc(o.ref) + "</b></td><td>" + A.esc(o.customer_name) + "<br><small class=\"note\">" + A.esc(o.phone) + "</small></td><td>" + A.money(o.total) +
        '</td><td><span class="tag ' + (o.payment_status === "paid" ? "ok" : "warn") + '">' + (o.payment_status === "paid" ? "Paid" : "Unpaid") + " · " + (o.payment_method === "transfer" ? "Transfer" : "Paystack") + "</span></td><td>" + A.esc(A.STATUS[o.status] || o.status) + "</td><td><small>" + fmt(o.created_at) + "</small></td></tr>";
    }).join("") : '<tr><td colspan="6" class="empty">No orders match.</td></tr>') + "</tbody></table></div>";
}
function drawer(title, body) {
  $("#drawerRoot").innerHTML = '<div class="scrim2" id="scrim2"></div><aside class="drawer" role="dialog" aria-label="' + A.esc(title) + '"><div class="dh"><h2>' + A.esc(title) + '</h2><button class="x" id="closeD" aria-label="Close">×</button></div>' + body + "</aside>";
  $("#scrim2").onclick = closeDrawer; $("#closeD").onclick = closeDrawer;
}
function closeDrawer() { $("#drawerRoot").innerHTML = ""; }
function openOrder(id) {
  var o = ORDERS.filter(function (x) { return x.id === id; })[0]; if (!o) return;
  drawer("Order " + o.ref, '<div class="empty">Loading…</div>');
  A.admin.events(id).then(function (ev) {
    drawer("Order " + o.ref,
      '<p><b>' + A.esc(o.customer_name) + "</b><br>" + A.esc(o.phone) + " · " + A.esc(o.email) + '<br><a href="' + waLink(o.phone, "Hello " + o.customer_name + ", this is " + A.C.name + " about your order " + o.ref + ".") + '" target="_blank" rel="noopener">Message on WhatsApp</a></p>' +
      "<p class=\"note\" style=\"margin:8px 0\">" + (o.delivery_method === "pickup" ? "Store pickup" : "Deliver to: " + A.esc([o.address, o.city, o.state].filter(Boolean).join(", "))) + "</p>" +
      '<div class="sum" style="margin:10px 0">' + (o.items || []).map(function (i) { return "<div><span>" + i.qty + " × " + A.esc(i.name) + "</span><span>" + A.money(i.price * i.qty) + "</span></div>"; }).join("") +
      "<div><span>Delivery</span><span>" + (Number(o.delivery_fee) ? A.money(o.delivery_fee) : "Free") + '</span></div><div class="tot"><span>Total</span><span>' + A.money(o.total) + "</span></div></div>" +
      '<p><span class="tag ' + (o.payment_status === "paid" ? "ok" : "warn") + '">' + (o.payment_status === "paid" ? "Paid" : "Payment pending") + "</span> <span class=\"note\">" + (o.payment_method === "transfer" ? "Bank transfer" : "Paystack") + "</span></p>" +
      (o.payment_status !== "paid" && o.status !== "cancelled" ? '<div class="actions"><button class="btn" id="paid">Mark as paid</button></div>' : "") +
      (o.payment_status === "paid" ? '<div class="msg ok" style="margin-top:12px"><b>Receipt ready</b><div class="actions" style="margin-top:8px"><a class="btn primary" target="_blank" rel="noopener" href="' + A.esc(A.receiptUrl(o)) + '">View receipt</a><a class="btn" target="_blank" rel="noopener" href="' + A.esc(A.receiptUrl(o, true)) + '">Download PDF</a><a class="btn" target="_blank" rel="noopener" href="' + A.esc(waLink(o.phone, "Hello " + o.customer_name + ", your payment of " + A.money(o.total) + " for order " + o.ref + " is confirmed. Thank you! Your receipt: " + A.receiptUrl(o))) + '">Send on WhatsApp</a></div></div>' : "") +
      '<div class="field" style="margin-top:14px"><label for="ns">Order status</label><select id="ns">' + STATUSES.map(function (s) { return '<option value="' + s + '"' + (s === o.status ? " selected" : "") + ">" + A.STATUS[s] + "</option>"; }).join("") + "</select></div>" +
      '<div class="field"><label for="nn">Message for the customer (optional)</label><input id="nn" placeholder="e.g. Rider Musa will call you"></div>' +
      '<div class="actions"><button class="btn primary" id="saveS">Update status</button></div><p class="note" style="margin-top:6px">Cancelling an order puts its items back in stock.</p>' +
      '<h3 style="margin:18px 0 8px;font-size:16px">History</h3><ul class="timeline">' + ev.slice().reverse().map(function (e) {
        return "<li><b>" + A.esc(A.STATUS[e.status] || e.status) + "</b>" + (e.note ? " · " + A.esc(e.note) : "") + "<br><small>" + fmt(e.created_at) + "</small></li>";
      }).join("") + "</ul>");
    $("#saveS").onclick = function () {
      var st = $("#ns").value; $("#saveS").disabled = true;
      A.admin.setStatus(o, st, $("#nn").value.trim()).then(function () { A.toast("Status updated"); return load(true); }).then(function () { openOrder(id); }).catch(function (e) { $("#saveS").disabled = false; fail(e); });
    };
    var pb = $("#paid");
    if (pb) pb.onclick = function () { pb.disabled = true; A.admin.markPaid(id).then(function () { A.toast("Marked as paid. Receipt is ready."); return load(true); }).then(function () { openOrder(id); }).catch(function (e) { pb.disabled = false; fail(e); }); };
  }).catch(function (e) { closeDrawer(); fail(e); });
}

/* ---------- products ---------- */
function filtered() {
  var q = pQ.trim().toLowerCase();
  return PRODUCTS.filter(function (p) {
    if (pCat && p.category !== pCat) return false;
    if (pF === "noprice" && p.price != null) return false;
    if (pF === "out" && !(p.stock != null && p.stock <= 0)) return false;
    if (pF === "low" && !(p.stock != null && p.stock <= 3)) return false;
    if (pF === "hidden" && p.active) return false;
    return !q || (p.name + " " + p.brand + " " + catName(p.category)).toLowerCase().indexOf(q) > -1;
  });
}
function products() {
  $("#view").innerHTML = '<div class="tb"><h2 class="t" style="margin:0">Products</h2><span class="sp"></span><button class="btn small" id="exp">Download list</button><button class="btn primary" id="addp">Add product</button></div>' +
    '<div class="tb"><input id="pq" type="search" placeholder="Search products or brands" value="' + A.esc(pQ) + '">' +
    '<select id="pc" aria-label="Category"><option value="">All categories</option>' + A.CAT.map(function (c) { return '<option value="' + c.slug + '"' + (pCat === c.slug ? " selected" : "") + ">" + A.esc(c.name) + "</option>"; }).join("") + "</select>" +
    '<select id="pf" aria-label="Filter">' + [["", "All products"], ["noprice", "No price"], ["low", "Low stock (3 or fewer)"], ["out", "Out of stock"], ["hidden", "Hidden from store"]].map(function (x) { return '<option value="' + x[0] + '"' + (pF === x[0] ? " selected" : "") + ">" + x[1] + "</option>"; }).join("") + "</select></div>" +
    '<div id="plist"></div><div id="bulk"></div>';
  plist();
}
function plist() {
  var list = filtered(), shown = list.slice(0, pLimit), allSel = shown.length && shown.every(function (p) { return SEL[p.id]; });
  $("#plist").innerHTML = '<p class="note" style="margin-bottom:8px">' + list.length + " of " + PRODUCTS.length + ' products. Change a price or stock number and it saves when you leave the box.</p><div class="tablewrap"><table style="min-width:760px"><thead><tr><th style="width:34px"><input type="checkbox" id="selall" aria-label="Select all"' + (allSel ? " checked" : "") + '></th><th>Product</th><th>Price (' + A.esc(A.C.currency) + ')</th><th>Stock</th><th>In store</th><th></th></tr></thead><tbody>' +
    (shown.length ? shown.map(function (p) {
      return '<tr data-id="' + A.esc(p.id) + '"><td><input type="checkbox" data-sel aria-label="Select ' + A.esc(p.name) + '"' + (SEL[p.id] ? " checked" : "") + '></td><td><div class="prod"><div class="pth">' + A.media(p) + '</div><div><b>' + A.esc(p.name) + "</b><small>" + A.esc(p.brand) + " · " + A.esc(catName(p.category)) + "</small></div></div></td>" +

var IMPORT = [];
function norm(s) { return String(s || "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, ""); }
function findCat(v) {
  var n = norm(v); if (!n) return null;
  return A.CAT.filter(function (c) { return norm(c.slug) === n || norm(c.name) === n || norm(c.singular) === n || norm(c.name) === n + "s"; })[0] || null;
}
function resolveCat(text) {
  var t = String(text || "").trim(); if (!t) return null;
  var c = findCat(t); if (c) return { slug: c.slug, name: c.name };
  var slug = A.slug(t); if (!slug) return null;
  return { slug: slug, name: A.titleCase(t), isNew: true };
}
function newCats(rc) { var m = {}; m[rc.slug] = rc.name; return m; }
function splitLine(line, d) {
  var out = [], cur = "", q = false, i, ch;
  for (i = 0; i < line.length; i++) {
    ch = line.charAt(i);
    if (q) { if (ch === '"') { if (line.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === d) { out.push(cur); cur = ""; } else cur += ch;
  }
  out.push(cur); return out.map(function (x) { return x.trim(); });
}
function parseImport(text) {
  var lines = text.replace(/\r/g, "").split("\n").filter(function (l) { return l.trim(); });
  if (!lines.length) return [];
  var d = lines[0].indexOf("\t") > -1 ? "\t" : ",";
  var rows = lines.map(function (l) { return splitLine(l, d); });
  if (norm(rows[0][0]) === "name" || norm(rows[0][0]) === "productname") rows.shift();
  return rows.map(function (c, i) {
    var cat = resolveCat(c[2]), price = numOrNull(c[3] || ""), stock = numOrNull(c[4] || ""), errs = [];
    if (!c[0]) errs.push("name missing");
    if (!c[1]) errs.push("brand missing");
    if (!cat) errs.push("category missing");
    if (price != null && (isNaN(price) || price < 0)) errs.push("price is not a number");
    if (stock != null && (isNaN(stock) || stock < 0)) errs.push("stock is not a number");
    var r = { name: c[0] || "", brand: c[1] || "", catText: c[2] || "", price: price, stock: stock == null || isNaN(stock) ? null : Math.floor(stock), description: c[5] || "", image_url: c[6] || "", errs: errs, n: i + 1 };
    if (cat) { r.category = cat.slug; r.newCat = cat.isNew ? cat.name : ""; r.catName = cat.name; r.id = cat.slug + "-" + A.slug(r.brand + " " + r.name).slice(0, 70); }
    return r;
  });
}

  if (t.matches("[data-sel]")) { SEL[t.closest("tr").dataset.id] = t.checked; return bulkBar(); }
  if (t.id === "pc") { pCat = t.value; pLimit = 60; return plist(); }
  if (t.id === "pf") { pF = t.value; pLimit = 60; return plist(); }
  if (t.matches("[data-f]")) {
    var tr = t.closest("tr"), id = tr.dataset.id, p = PRODUCTS.filter(function (x) { return x.id === id; })[0], f = t.dataset.f, v = numOrNull(t.value);
    if (v != null && (isNaN(v) || v < 0)) { A.toast("Enter a number that is 0 or more."); t.value = p[f] == null ? "" : p[f]; return; }
    if (f === "stock" && v != null) v = Math.floor(v);
    var patch = {}; patch[f] = v;
    A.admin.updateProducts([id], patch).then(function () { p[f] = v; t.style.outline = "2px solid var(--ok)"; setTimeout(function () { t.style.outline = ""; }, 900); }).catch(function (err) { t.value = p[f] == null ? "" : p[f]; fail(err); });
  }
});
document.addEventListener("input", function (e) {
  if (e.target.id === "oq") { oQ = e.target.value; ordersList(); }
  if (e.target.id === "pq") { pQ = e.target.value; pLimit = 60; plist(); }
});
document.addEventListener("submit", function (e) {
  if (e.target.id === "pw") {
    e.preventDefault();
    var a = $("#p1").value, b = $("#p2").value;
    if (a !== b) return A.toast("The two passwords do not match.");
    A.admin.changePassword(a).then(function () { A.toast("Password changed"); e.target.reset(); }).catch(fail);
  }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
window.addEventListener("hashchange", function () { var h = location.hash.replace("#", ""); if (TABS.some(function (t) { return t[0] === h; }) && h !== view) { view = h; SEL = {}; if (!$("#app").hidden) render(); } });
setInterval(function () { if (!document.hidden && !$("#app").hidden && !$("#drawerRoot").innerHTML && (view === "orders" || view === "overview")) load(true); }, 60000);

gate();
</script>
