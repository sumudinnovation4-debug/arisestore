<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=3"></head>
<body>
<div id="site-header"></div>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="assets/catalog.js?v=3"></script><script src="assets/app.js?v=3"></script>
<script>
A.layout("categories");
var id = new URLSearchParams(location.search).get("id");
A.getProducts().then(function (list) {
  var p = list.filter(function (x) { return x.id === id; })[0];
  var main = document.getElementById("main");
  if (!p) { main.innerHTML = '<div class="empty">We could not find that product. <a href="shop.html">Back to the shop</a></div>'; return; }
  var c = A.cat(p.category);
  document.title = p.name + " | " + A.C.name;
  var buy = A.inStock(p);
  var stock = p.price == null ? "" : !A.inStock(p) ? '<span class="tag bad">Out of stock</span>'
    : (p.stock != null && p.stock <= 5 ? '<span class="tag warn">Only ' + p.stock + " left</span>" : '<span class="tag ok">In stock</span>');
  var box = '<div class="buybox">' +
    (p.price != null ? '<div class="price">' + A.money(p.price) + "</div>" : '<div class="price ask">Price on request</div>') + stock;
  if (buy) box += '<div style="display:flex;align-items:center;gap:10px"><span class="note">Quantity</span><div class="qty"><button id="minus" aria-label="Fewer">−</button><span id="q">1</span><button id="plus" aria-label="More">+</button></div></div>' +
    '<button class="btn primary" id="add" style="border-radius:99px">Add to cart</button><button class="btn yellow" id="buy" style="border-radius:99px">Buy now</button>';
  if (p.price == null) box += '<p class="note">Price on request. Add it to your cart and we confirm the price, or ask us now.</p>' +
    (A.C.whatsapp ? '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + A.esc(A.C.whatsapp) + "?text=" + encodeURIComponent("Hello, please send me the price and availability for " + p.name) + '">Ask for the price on WhatsApp</a>' : "");
  box += '<p class="note">Pickup from the store or delivery. Pay by card, bank or transfer. Track your order after checkout.</p></div>';

  main.innerHTML =
    '<p class="crumbs"><a href="shop.html">Shop</a> › <a href="shop.html?cat=' + p.category + '">' + A.esc(c ? c.name : "") + "</a></p>" +
    '<div class="pp"><div class="gal">' + A.media(p) + "</div>" +
    '<div class="info"><span class="brand">' + A.esc(p.brand) + "</span><h1>" + A.esc(p.name) + "</h1><p>" + A.esc(p.description || "") + "</p>" +
    (c ? '<div class="tips" style="margin-top:14px"><h2 style="font-size:16px">Before you buy</h2><ul>' + c.tips.map(function (t) { return "<li>" + A.esc(t) + "</li>"; }).join("") + "</ul></div>" : "") + "</div>" +
    box + "</div>" +
    '<section class="shelf" style="margin-top:16px"><div class="sechead"><h2>More ' + A.esc(c ? c.name : "products") + '</h2><a href="shop.html?cat=' + p.category + '">See all</a></div><div class="rail" id="related"></div></section>';
  var rel = list.filter(function (x) { return x.category === p.category && x.id !== p.id; }).slice(0, 10);
  document.getElementById("related").innerHTML = rel.map(A.productCard).join("");
  if (buy) {
    var q = 1, max = p.stock == null ? 50 : Math.min(50, p.stock);
    var qEl = document.getElementById("q");
    document.getElementById("minus").onclick = function () { q = Math.max(1, q - 1); qEl.textContent = q; };
    document.getElementById("plus").onclick = function () { q = Math.min(max, q + 1); qEl.textContent = q; };
    document.getElementById("add").onclick = function () { A.cart.add(p.id, q); A.toast("Added to your cart"); };
    document.getElementById("buy").onclick = function () { A.cart.add(p.id, q); location.href = "cart.html"; };
  }
}).catch(function (e) {
  document.getElementById("main").innerHTML = '<div class="empty">Could not load this product. ' + A.esc(e.message) + "</div>";
});
</script>
</body></html>
