<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Categories | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css"></head>
<body>
<div id="site-header"></div>
<main class="wrap">
  <div class="titlebar"><h1>All categories</h1><a class="chip" href="shop.html">All products</a></div>
  <div class="catgrid lg" id="catgrid"></div>
</main>
<div id="site-footer"></div>
<script src="config.js"></script><script src="assets/catalog.js"></script><script src="assets/app.js"></script>
<script>
A.layout("categories");
document.getElementById("catgrid").innerHTML = A.CAT.map(function (c) {
  return '<a class="cat" href="shop.html?cat=' + c.slug + '">' + A.mediaFor(c.slug, c.wiki ? c.wiki[0] : "", c.name, "") + "<b>" + A.esc(c.name) + "</b><small>" + A.esc(c.brands.join(", ")) + "</small></a>";
}).join("");
</script>
</body></html>
