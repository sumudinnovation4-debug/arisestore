<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop | Arise and Shine Digital World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=3"></head>
<body>
<div id="site-header"></div>

<main class="wrap">
  <div class="titlebar">
    <div><h1 id="title">All products</h1><div class="sub" id="sub"></div></div>
    <label style="font-size:13px">Sort <select id="sort">
      <option value="">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option><option value="name">Name</option></select></label>
  </div>
  <div id="tips"></div>
  <div class="chips scroll" id="brands" style="margin-bottom:12px"></div>
  <div class="grid" id="grid"><div class="empty" style="grid-column:1/-1">Loading products…</div></div>
</main>

<div id="site-footer"></div>
<script src="config.js"></script><script src="assets/catalog.js?v=3"></script><script src="assets/app.js?v=3"></script>
<script>
var qs = new URLSearchParams(location.search);
var st = { cat: qs.get("cat") || "", brand: qs.get("brand") || "", q: qs.get("q") || "", sort: qs.get("sort") || "" };
A.layout("categories", { strip: st.cat || true, q: st.q });
var ALL = [], $ = A.$;
$("#sort").value = st.sort;

function sync() {
  var p = new URLSearchParams();
  Object.keys(st).forEach(function (k) { if (st[k]) p.set(k, st[k]); });
  history.replaceState(null, "", "shop.html" + (p.toString() ? "?" + p : ""));
}
function head() {
  var c = A.cat(st.cat);
  if (c) {
    document.title = c.name + " | " + A.C.name;
    $("#title").textContent = c.name;
    $("#tips").innerHTML = !c.tips.length ? "" : '<details class="tips"><summary>About ' + A.esc(c.name) + " and buying tips</summary><p class=\"note\" style=\"margin-top:8px\">" + A.esc(c.blurb) + " We carry " + A.esc(c.brands.join(", ")) + ".</p><ul>" +
      c.tips.map(function (t) { return "<li>" + A.esc(t) + "</li>"; }).join("") + "</ul></details>";
  } else {
    document.title = (st.q ? "Search" : "Shop") + " | " + A.C.name;
    $("#title").textContent = st.q ? "Results for “" + st.q + "”" : "All products";
    $("#tips").innerHTML = "";
  }
}
function brandsRow() {
  var pool = ALL.filter(function (p) { return !st.cat || p.category === st.cat; });
  var m = {}; pool.forEach(function (p) { m[p.brand] = (m[p.brand] || 0) + 1; });
  var h = '<button class="chip" aria-pressed="' + !st.brand + '" data-b="">All brands</button>';
  Object.keys(m).sort().forEach(function (b) {
    h += '<button class="chip" aria-pressed="' + (st.brand === b) + '" data-b="' + A.esc(b) + '">' + A.esc(b) + " <em>" + m[b] + "</em></button>";
  });
  $("#brands").innerHTML = h;
}
function grid() {
  var q = st.q.trim().toLowerCase();
  var list = ALL.filter(function (p) {
    if (st.cat && p.category !== st.cat) return false;
    if (st.brand && p.brand !== st.brand) return false;
    return !q || (p.name + " " + p.brand + " " + (A.cat(p.category) || {}).name + " " + (p.description || "")).toLowerCase().indexOf(q) > -1;
  });
  list.sort(function (a, b) {
    if (st.sort === "name") return a.name.localeCompare(b.name);
    var pa = a.price == null, pb = b.price == null;
    if (pa !== pb) return pa ? 1 : -1;
    if (st.sort === "asc") return a.price - b.price;
    if (st.sort === "desc") return b.price - a.price;
    return 0;
  });
  $("#sub").textContent = list.length + (list.length === 1 ? " product" : " products");
  $("#grid").innerHTML = list.length ? list.map(A.productCard).join("") :
    '<div class="empty" style="grid-column:1/-1">No products match. Try another brand or search word.</div>';
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-b]"); if (!b) return;
  st.brand = b.getAttribute("data-b"); brandsRow(); grid(); sync();
});
$("#sort").addEventListener("change", function (e) { st.sort = e.target.value; grid(); sync(); });
A.getProducts().then(function (l) { ALL = l; head(); brandsRow(); grid(); sync(); }).catch(function (e) {
  $("#grid").innerHTML = '<div class="empty" style="grid-column:1/-1">Could not load products. ' + A.esc(e.message) + "</div>";
});
</script>
</body></html>
